name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Installa le dipendenze necessarie alla compilazione del tuo progetto su Ubuntu
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libnl-3-dev libnl-genl-3-dev libssl-dev pkg-config build-essential

    # Compila usando il tuo Makefile personalizzato
    - name: Compile Project
      run: make